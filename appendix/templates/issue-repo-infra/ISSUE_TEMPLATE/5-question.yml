name: 使用问询
description: 怎么用、某个现象是否符合预期
labels:
- type/question
body:
- type: markdown
  attributes:
    value: 只有第一项**必填**：用自己的话描述问题就行。其余都是建议，愿意填就填，不填我们来补。
- type: textarea
  id: q
  attributes:
    label: 问题描述
    description: 想问什么
  validations:
    required: true
- type: dropdown
  id: area
  attributes:
    label: 跟哪块有关
    options:
    - 切片调度与供给（gke-component-d、gke-component-c、gke-component-b、gke-component-a）
    - device plugin
    - Kueue / JobSet
    - 节点池（创建、升级、扩缩）
    - 维修与健康（含芯片、主机故障）
    - 存储挂载（Lustre、GCSFuse、Hyperdisk 等 CSI）
    - 网络：ICI / DCN / OCS
    - 网络：VPC、NAT、DNS、多网卡
    - 配额与容量
    - 不知道 / 都不是
    description: 不确定就选「不知道」，查清楚后由负责人打 area/* 标签
  validations:
    required: false
- type: textarea
  id: ctx
  attributes:
    label: 背景
    description: 在做什么、为什么问
  validations:
    required: false
- type: markdown
  attributes:
    value: '### 运行条件（建议填写）

      能填多少填多少，写全了我们拿到就能复现；不清楚的空着，我们来补。'
- type: input
  id: cluster
  attributes:
    label: 集群与版本
    description: GCP 项目、集群名和 location、GKE 版本
    placeholder: my-project / my-cluster / us-central1，GKE 1.33.5-gke.1080000
  validations:
    required: false
- type: input
  id: pool
  attributes:
    label: 节点池
    description: 机型、拓扑、节点数；预留、spot 还是 flex-start
    placeholder: tpu7x-standard-4t，4x4x4，16 节点，预留
  validations:
    required: false
